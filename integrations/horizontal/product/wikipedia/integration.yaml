# Wikipedia: Checked 2026-11-17: the page-summary request NortPole builds was sent to the live service and its answer read with NortPole's own field extractor; the search action was not (rate limited). The full call path was not run, because the sandbox cannot resolve hosts directly.
schema_version: 1
id: wikipedia
name: Wikipedia
version: 1.0.0
description: Look up a Wikipedia page summary or search page titles, for background on a topic.
kind: plugin
group: horizontal
category: product
auth:
  mode: none
hosts:
- en.wikipedia.org
data_classes:
- public
policy_default: allowed
actions:
- id: page_summary
  name: Page summary
  description: Get the summary of a Wikipedia page by its title.
  effect: read
  params:
    pageTitle:
      type: string
      description: Title of the page.
      required: true
  request:
    method: GET
    url: https://en.wikipedia.org/api/rest_v1/page/summary/{pageTitle}
    headers: &id001
      User-Agent: NortPole/1.0
      Accept: application/json
  response:
    outputs:
      title:
        path: $.title
        type: string
        description: Page title.
      description:
        path: $.description
        type: string
        description: Short description.
      extract:
        path: $.extract
        type: string
        description: Plain-text summary.
      url:
        path: $.content_urls.desktop.page
        type: string
        description: Link to the page.
- id: search
  name: Search pages
  description: Search Wikipedia page titles and text.
  effect: read
  params:
    query:
      type: string
      description: What to search for.
      required: true
    limit:
      type: integer
      description: How many results to return (1 to 50).
      fill: user
      default: 10
      minimum: 1
      maximum: 50
  request:
    method: GET
    url: https://en.wikipedia.org/w/api.php
    headers: *id001
    query:
      action: query
      list: search
      format: json
      srsearch: '{query}'
      srlimit: '{limit}'
  response:
    outputs:
      results:
        path: $.query.search[*]
        type: array
        description: Matches, each with a title and a snippet.
