# Wikipedia: look up a page summary or search page titles. No sign-in; public data.
# search is written for NortPole on the standard MediaWiki query API.
# Derived from open-source (Apache-2.0) tool definitions: see ../../../NOTICE. Reviewed before use; not yet checked against the vendor's own documentation.
schema_version: 1
id: wikipedia
name: Wikipedia
version: 1.0.0
description: Look up a Wikipedia page summary or search page titles, for background on a topic.
kind: plugin
group: horizontal
category: product
auth:
  mode: none
hosts:
  - en.wikipedia.org
data_classes:
  - public
policy_default: allowed
actions:
  - id: page_summary
    name: Page summary
    description: Get the summary of a Wikipedia page by its title.
    effect: read
    params:
      pageTitle:
        type: string
        required: true
        description: Title of the Wikipedia page to get the summary for.
    request:
      method: GET
      url: https://en.wikipedia.org/api/rest_v1/page/summary/{pageTitle}
      headers:
        User-Agent: NortPole/1.0
        Accept: application/json
    response:
      outputs:
        title:
          path: $.title
          type: string
          description: Page title.
        description:
          path: $.description
          type: string
          description: Short description of the page.
        extract:
          path: $.extract
          type: string
          description: Plain-text summary.
        url:
          path: $.content_urls.desktop.page
          type: string
          description: Link to the page.
  - id: search
    name: Search pages
    description: Search Wikipedia page titles and text.
    effect: read
    params:
      query:
        type: string
        required: true
        description: What to search for.
      limit:
        type: integer
        fill: user
        default: 10
        minimum: 1
        maximum: 50
        description: How many results to return (1 to 50).
    request:
      method: GET
      url: https://en.wikipedia.org/w/api.php
      query:
        action: query
        list: search
        format: json
        srsearch: "{query}"
        srlimit: "{limit}"
      headers:
        User-Agent: NortPole/1.0
        Accept: application/json
    response:
      outputs:
        results:
          path: $.query.search[*]
          type: array
          description: Matching pages, each with a title and a text snippet.
