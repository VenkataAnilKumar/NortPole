# Dropbox: 7 actions. Adapted from Sim's tools/dropbox/ (Apache-2.0, see ../../../NOTICE).
# Source files: copy.ts, create_folder.ts, delete.ts, get_metadata.ts, list_revisions.ts, move.ts, restore.ts. Drafted by tools/import_sim; reviewed before use. Sign-in scopes are not set yet.
schema_version: 1
id: dropbox
name: Dropbox
version: 1.0.0
description: Upload, download, share, and manage files in Dropbox
kind: plugin
group: horizontal
category: product
auth:
  mode: oauth
  provider: dropbox
  scopes: []
hosts:
- api.dropboxapi.com
data_classes:
- internal
policy_default: needs_approval
actions:
- id: copy
  name: Copy
  description: Copy a file or folder in Dropbox
  effect: write
  params:
    fromPath:
      type: string
      description: The source path of the file or folder to copy
      required: true
    toPath:
      type: string
      description: The destination path for the copied file or folder
      required: true
    autorename:
      type: boolean
      description: If true, rename the file if there is a conflict at destination
      fill: user
      default: false
  request:
    method: POST
    url: https://api.dropboxapi.com/2/files/copy_v2
    headers:
      Authorization: Bearer {credential.access_token}
      Content-Type: application/json
    body:
      from_path: '{fromPath}'
      to_path: '{toPath}'
      autorename: '{autorename}'
  response:
    outputs:
      metadata:
        path: $.metadata
        type: object
        description: Metadata of the copied item
- id: create_folder
  name: Create Folder
  description: Create a new folder in Dropbox
  effect: write
  params:
    path:
      type: string
      description: The path where the folder should be created (e.g., /new-folder)
      required: true
    autorename:
      type: boolean
      description: If true, rename the folder if there is a conflict
      fill: user
      default: false
  request:
    method: POST
    url: https://api.dropboxapi.com/2/files/create_folder_v2
    headers:
      Authorization: Bearer {credential.access_token}
      Content-Type: application/json
    body:
      path: '{path}'
      autorename: '{autorename}'
  response:
    outputs:
      folder:
        path: $.metadata
        type: object
        description: The created folder metadata
- id: delete
  name: Delete
  description: Delete a file or folder in Dropbox (moves to trash)
  effect: write
  params:
    path:
      type: string
      description: The path of the file or folder to delete
      required: true
  request:
    method: POST
    url: https://api.dropboxapi.com/2/files/delete_v2
    headers:
      Authorization: Bearer {credential.access_token}
      Content-Type: application/json
    body:
      path: '{path}'
  response:
    outputs:
      metadata:
        path: $.metadata
        type: object
        description: Metadata of the deleted item
- id: get_metadata
  name: Get Metadata
  description: Get metadata for a file or folder in Dropbox
  effect: read
  params:
    path:
      type: string
      description: The path of the file or folder to get metadata for
      required: true
    includeMediaInfo:
      type: boolean
      description: If true, include media info for photos/videos
      fill: user
      default: false
    includeDeleted:
      type: boolean
      description: If true, include deleted files in results
      fill: user
      default: false
  request:
    method: POST
    url: https://api.dropboxapi.com/2/files/get_metadata
    headers:
      Authorization: Bearer {credential.access_token}
      Content-Type: application/json
    body:
      path: '{path}'
      include_media_info: '{includeMediaInfo}'
      include_deleted: '{includeDeleted}'
  response:
    outputs:
      metadata:
        path: $
        type: object
        description: Metadata for the file or folder
- id: list_revisions
  name: List Revisions
  description: List the revision history for a file in Dropbox (files only, not folders)
  effect: read
  params:
    path:
      type: string
      description: The path of the file to list revisions for
      required: true
    limit:
      type: integer
      description: 'Maximum number of revisions to return, 1-100 (default: 10)'
      fill: user
      default: 10
    beforeRev:
      type: string
      description: Only return revisions before this one. Pass the rev of the last revision from a previous call to fetch
        the next page.
      fill: user
  request:
    method: POST
    url: https://api.dropboxapi.com/2/files/list_revisions
    headers:
      Authorization: Bearer {credential.access_token}
      Content-Type: application/json
    body:
      path: '{path}'
      mode: path
      limit: '{limit}'
      before_rev: '{beforeRev}'
  response:
    outputs:
      entries:
        path: $.entries
        type: array
        description: The revisions for the file, most recent first
      isDeleted:
        path: $.is_deleted
        type: boolean
        description: Whether the file identified by the latest revision is deleted or moved
      hasMore:
        path: $.has_more
        type: boolean
        description: Whether there are more revisions available
- id: move
  name: Move
  description: Move or rename a file or folder in Dropbox
  effect: write
  params:
    fromPath:
      type: string
      description: The source path of the file or folder to move
      required: true
    toPath:
      type: string
      description: The destination path for the moved file or folder
      required: true
    autorename:
      type: boolean
      description: If true, rename the file if there is a conflict at destination
      fill: user
      default: false
  request:
    method: POST
    url: https://api.dropboxapi.com/2/files/move_v2
    headers:
      Authorization: Bearer {credential.access_token}
      Content-Type: application/json
    body:
      from_path: '{fromPath}'
      to_path: '{toPath}'
      autorename: '{autorename}'
  response:
    outputs:
      metadata:
        path: $.metadata
        type: object
        description: Metadata of the moved item
- id: restore
  name: Restore
  description: Restore a specific revision of a file to the given path
  effect: write
  params:
    path:
      type: string
      description: The path to save the restored file to
      required: true
    rev:
      type: string
      description: The revision identifier to restore (from Dropbox List Revisions)
      required: true
  request:
    method: POST
    url: https://api.dropboxapi.com/2/files/restore
    headers:
      Authorization: Bearer {credential.access_token}
      Content-Type: application/json
    body:
      path: '{path}'
      rev: '{rev}'
  response:
    outputs:
      metadata:
        path: $
        type: object
        description: Metadata of the restored file
