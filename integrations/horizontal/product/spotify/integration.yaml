# Spotify: Checked 2026-11-17 against the vendor's API reference (methods, URLs, parameter names, limits); not called against the live service.
schema_version: 1
id: spotify
name: Spotify
version: 1.0.0
description: Search music and read your Spotify library and playlists with your own Spotify account.
kind: plugin
group: horizontal
category: product
auth:
  mode: oauth
  provider: spotify
  scopes:
  - user-read-private
  - user-top-read
  - playlist-read-private
  - user-read-currently-playing
hosts:
- api.spotify.com
data_classes:
- internal
policy_default: needs_approval
actions:
- id: search
  name: Search
  description: Search for tracks, albums, artists or playlists.
  effect: read
  params:
    q:
      type: string
      description: What to search for.
      required: true
    type:
      type: string
      description: 'What to find: track, album, artist or playlist.'
      enum:
      - track
      - album
      - artist
      - playlist
      default: track
    limit:
      type: integer
      description: Results per type (1 to 10).
      minimum: 1
      maximum: 10
      default: 5
  request:
    method: GET
    url: https://api.spotify.com/v1/search
    headers: &id001
      Authorization: Bearer {credential.access_token}
    query:
      q: '{q}'
      type: '{type}'
      limit: '{limit}'
  response:
    outputs:
      tracks:
        path: $.tracks.items[*]
        type: array
        description: Matching tracks.
      albums:
        path: $.albums.items[*]
        type: array
        description: Matching albums.
      artists:
        path: $.artists.items[*]
        type: array
        description: Matching artists.
      playlists:
        path: $.playlists.items[*]
        type: array
        description: Matching playlists.
- id: get_track
  name: Get track
  description: Get one track by ID.
  effect: read
  params:
    trackId:
      type: string
      description: Spotify track ID.
      required: true
  request:
    method: GET
    url: https://api.spotify.com/v1/tracks/{trackId}
    headers: *id001
  response:
    outputs:
      name:
        path: $.name
        type: string
        description: Track name.
      artists:
        path: $.artists[*]
        type: array
        description: Artists.
      album:
        path: $.album
        type: object
        description: Album.
      duration_ms:
        path: $.duration_ms
        type: integer
        description: Length in milliseconds.
- id: get_album
  name: Get album
  description: Get one album by ID.
  effect: read
  params:
    albumId:
      type: string
      description: Spotify album ID.
      required: true
  request:
    method: GET
    url: https://api.spotify.com/v1/albums/{albumId}
    headers: *id001
  response:
    outputs:
      name:
        path: $.name
        type: string
        description: Album name.
      release_date:
        path: $.release_date
        type: string
        description: Release date.
      tracks:
        path: $.tracks.items[*]
        type: array
        description: Tracks on the album.
- id: get_artist
  name: Get artist
  description: Get one artist by ID.
  effect: read
  params:
    artistId:
      type: string
      description: Spotify artist ID.
      required: true
  request:
    method: GET
    url: https://api.spotify.com/v1/artists/{artistId}
    headers: *id001
  response:
    outputs:
      name:
        path: $.name
        type: string
        description: Artist name.
      genres:
        path: $.genres
        type: array
        description: Genres.
      followers:
        path: $.followers.total
        type: integer
        description: Follower count.
- id: get_playlist
  name: Get playlist
  description: Get one playlist by ID.
  effect: read
  params:
    playlistId:
      type: string
      description: Spotify playlist ID.
      required: true
  request:
    method: GET
    url: https://api.spotify.com/v1/playlists/{playlistId}
    headers: *id001
  response:
    outputs:
      name:
        path: $.name
        type: string
        description: Playlist name.
      description:
        path: $.description
        type: string
        description: Description.
      tracks:
        path: $.tracks.items[*]
        type: array
        description: Items in the playlist.
- id: get_my_profile
  name: Get my profile
  description: Get your own Spotify profile.
  effect: read
  request:
    method: GET
    url: https://api.spotify.com/v1/me
    headers: *id001
  response:
    outputs:
      display_name:
        path: $.display_name
        type: string
        description: Display name.
      id:
        path: $.id
        type: string
        description: User ID.
      country:
        path: $.country
        type: string
        description: Country.
- id: list_my_playlists
  name: List my playlists
  description: List your playlists.
  effect: read
  params:
    limit:
      type: integer
      description: Playlists to return (1 to 50).
      minimum: 1
      maximum: 50
      default: 20
  request:
    method: GET
    url: https://api.spotify.com/v1/me/playlists
    headers: *id001
    query:
      limit: '{limit}'
  response:
    outputs:
      playlists:
        path: $.items[*]
        type: array
        description: Your playlists.
- id: get_my_top_items
  name: Get my top items
  description: Get your most played artists or tracks.
  effect: read
  params:
    type:
      type: string
      description: artists or tracks.
      enum:
      - artists
      - tracks
      required: true
    limit:
      type: integer
      description: Items to return (1 to 50).
      minimum: 1
      maximum: 50
      default: 10
  request:
    method: GET
    url: https://api.spotify.com/v1/me/top/{type}
    headers: *id001
    query:
      limit: '{limit}'
  response:
    outputs:
      items:
        path: $.items[*]
        type: array
        description: Your top items.
- id: get_currently_playing
  name: Get currently playing
  description: Get what you are playing now.
  effect: read
  request:
    method: GET
    url: https://api.spotify.com/v1/me/player/currently-playing
    headers: *id001
  response:
    outputs:
      item:
        path: $.item
        type: object
        description: The track playing now.
      is_playing:
        path: $.is_playing
        type: boolean
        description: True while playing.
