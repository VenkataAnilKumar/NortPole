# Notion: Checked 2026-11-17 against the vendor's API reference (methods, URLs, parameter names, limits); not called against the live service.
schema_version: 1
id: notion
name: Notion
version: 1.0.0
description: Search, read and edit Notion pages and databases with your own Notion account.
kind: plugin
group: horizontal
category: product
auth:
  mode: oauth
  provider: notion
  scopes: []
hosts:
- api.notion.com
data_classes:
- internal
- confidential
policy_default: needs_approval
actions:
- id: search
  name: Search
  description: Search pages and databases you shared with the connection.
  effect: read
  params:
    query:
      type: string
      description: Text to search for.
    pageSize:
      type: integer
      description: Results to return (1 to 100).
      minimum: 1
      maximum: 100
      default: 10
  request:
    method: POST
    url: https://api.notion.com/v1/search
    headers: &id002
      Authorization: Bearer {credential.access_token}
      Notion-Version: '2022-06-28'
      Content-Type: application/json
    body:
      query: '{query}'
      page_size: '{pageSize}'
  response:
    outputs:
      results:
        path: $.results[*]
        type: array
        description: Pages and databases.
      next_cursor:
        path: $.next_cursor
        type: string
        description: Cursor for the next page.
- id: get_page
  name: Get page
  description: Get a page's properties by ID.
  effect: read
  params:
    pageId:
      type: string
      description: Page ID.
      required: true
  request:
    method: GET
    url: https://api.notion.com/v1/pages/{pageId}
    headers: &id001
      Authorization: Bearer {credential.access_token}
      Notion-Version: '2022-06-28'
  response:
    outputs:
      id:
        path: $.id
        type: string
        description: Page ID.
      properties:
        path: $.properties
        type: object
        description: Page properties.
      url:
        path: $.url
        type: string
        description: Link to the page.
- id: get_page_content
  name: Get page content
  description: Read the blocks that make up a page.
  effect: read
  params:
    blockId:
      type: string
      description: Page or block ID.
      required: true
    pageSize:
      type: integer
      description: Blocks to return (1 to 100).
      minimum: 1
      maximum: 100
      default: 50
  request:
    method: GET
    url: https://api.notion.com/v1/blocks/{blockId}/children
    headers: *id001
    query:
      page_size: '{pageSize}'
  response:
    outputs:
      blocks:
        path: $.results[*]
        type: array
        description: Blocks in order.
      next_cursor:
        path: $.next_cursor
        type: string
        description: Cursor for the next page.
- id: get_database
  name: Get database
  description: Get a database's title and properties.
  effect: read
  params:
    databaseId:
      type: string
      description: Database ID.
      required: true
  request:
    method: GET
    url: https://api.notion.com/v1/databases/{databaseId}
    headers: *id001
  response:
    outputs:
      id:
        path: $.id
        type: string
        description: Database ID.
      title:
        path: $.title
        type: array
        description: Title as rich text.
      properties:
        path: $.properties
        type: object
        description: Column definitions.
- id: query_database
  name: Query database
  description: List the rows of a database, optionally filtered.
  effect: read
  params:
    databaseId:
      type: string
      description: Database ID.
      required: true
    filter:
      type: object
      description: A Notion filter object.
    pageSize:
      type: integer
      description: Rows to return (1 to 100).
      minimum: 1
      maximum: 100
      default: 25
  request:
    method: POST
    url: https://api.notion.com/v1/databases/{databaseId}/query
    headers: *id002
    body:
      filter: '{filter}'
      page_size: '{pageSize}'
  response:
    outputs:
      rows:
        path: $.results[*]
        type: array
        description: Rows (pages) with their properties.
      next_cursor:
        path: $.next_cursor
        type: string
        description: Cursor for the next page.
- id: create_page
  name: Create page
  description: Create a page in a page or a database.
  effect: write
  params:
    parent:
      type: object
      description: 'Where it goes, for example {"database_id": "..."}.'
      required: true
    properties:
      type: object
      description: Property values as Notion expects them.
      required: true
  request:
    method: POST
    url: https://api.notion.com/v1/pages
    headers: *id002
    body:
      parent: '{parent}'
      properties: '{properties}'
  response:
    outputs:
      id:
        path: $.id
        type: string
        description: New page ID.
      url:
        path: $.url
        type: string
        description: Link to the page.
- id: update_page
  name: Update page
  description: Change a page's properties.
  effect: write
  params:
    pageId:
      type: string
      description: Page ID.
      required: true
    properties:
      type: object
      description: Property values to change.
      required: true
  request:
    method: PATCH
    url: https://api.notion.com/v1/pages/{pageId}
    headers: *id002
    body:
      properties: '{properties}'
  response:
    outputs:
      id:
        path: $.id
        type: string
        description: Page ID.
      url:
        path: $.url
        type: string
        description: Link to the page.
skills:
- name: notion-page-summary
  description: Find a Notion page and summarise it with its open tasks.
  content: When asked to summarise something in Notion, search for it, read the page and its content, then give a five-line
    summary and list any open to-dos or questions found in it. If several pages match, list them and ask which one.
