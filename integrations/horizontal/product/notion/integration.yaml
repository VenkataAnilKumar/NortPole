# Notion: read and write actions. Derived from open-source (Apache-2.0) tool definitions: see ../../../NOTICE. Reviewed before use; not yet checked against the vendor's own documentation.
schema_version: 1
id: notion
name: Notion
version: 1.0.0
description: Manage Notion pages
kind: plugin
group: horizontal
category: product
auth:
  mode: oauth
  provider: notion
  scopes: []
hosts:
- api.notion.com
data_classes:
- internal
policy_default: needs_approval
actions:
- id: delete_block
  name: Delete Block
  description: Delete (move to trash) a single Notion block
  effect: write
  params:
    blockId:
      type: string
      description: The UUID of the block to delete
      required: true
  request:
    method: DELETE
    url: https://api.notion.com/v1/blocks/{blockId}
    headers:
      Authorization: Bearer {credential.access_token}
      Notion-Version: '2022-06-28'
      Content-Type: application/json
  response:
    outputs:
      archived:
        path: $.archived
        type: boolean
        description: Whether the block was archived (moved to trash)
- id: retrieve_block
  name: Retrieve Block
  description: Retrieve a single Notion block by its UUID, including its type-specific content
  effect: read
  params:
    blockId:
      type: string
      description: The UUID of the block to retrieve
      required: true
  request:
    method: GET
    url: https://api.notion.com/v1/blocks/{blockId}
    headers:
      Authorization: Bearer {credential.access_token}
      Notion-Version: '2022-06-28'
      Content-Type: application/json
  response:
    outputs:
      block:
        path: $
        type: object
        description: The full Notion block object. Includes a type-specific field (e.g. paragraph, heading_1, image) whose
          shape varies by block type and is not enumerated below — read it directly off this object.
- id: retrieve_user
  name: Retrieve User
  description: Retrieve a single Notion user by their UUID
  effect: read
  params:
    userId:
      type: string
      description: The UUID of the user to retrieve
      required: true
  request:
    method: GET
    url: https://api.notion.com/v1/users/{userId}
    headers:
      Authorization: Bearer {credential.access_token}
      Notion-Version: '2022-06-28'
      Content-Type: application/json
  response:
    outputs:
      email:
        path: $.person.email
        type: string
        description: User email address (person users only)
