# Airtable: read bases, tables' records and single records. Sign in with your own Airtable account.
# Derived from open-source (Apache-2.0) tool definitions: see ../../../NOTICE. Reviewed before use; not yet checked against the vendor's own documentation.
schema_version: 1
id: airtable
name: Airtable
version: 1.0.0
description: Read Airtable bases and records with your own Airtable account.
kind: plugin
group: horizontal
category: automations
auth:
  mode: oauth
  provider: airtable
  scopes:
    - data.records:read
    - schema.bases:read
hosts:
  - api.airtable.com
data_classes:
  - internal
  - confidential
policy_default: needs_approval
actions:
  - id: list_bases
    name: List bases
    description: List the Airtable bases you can read.
    effect: read
    params:
      offset:
        type: string
        description: Pagination offset from a previous response, to fetch the next page of bases.
    request:
      method: GET
      url: https://api.airtable.com/v0/meta/bases
      query:
        offset: "{offset}"
      headers:
        Authorization: Bearer {credential.access_token}
    response:
      outputs:
        bases:
          path: $.bases[*]
          type: array
          description: Bases you can read, each with an id and a name.
        offset:
          path: $.offset
          type: string
          description: Offset for the next page, if there is one.
  - id: list_records
    name: List records
    description: Read records from an Airtable table.
    effect: read
    params:
      baseId:
        type: string
        required: true
        description: Airtable base ID (starts with "app", for example "appXXXXXXXXXXXXXX").
      tableId:
        type: string
        required: true
        description: Table ID (starts with "tbl") or the table name.
      maxRecords:
        type: integer
        minimum: 1
        maximum: 1000
        description: Maximum total number of records to return.
      filterFormula:
        type: string
        description: Formula that filters records, for example ({Status} = 'Open').
      pageSize:
        type: integer
        minimum: 1
        maximum: 100
        description: Records per page (1 to 100).
      offset:
        type: string
        description: Pagination offset from a previous response, to fetch the next page.
      view:
        type: string
        description: View name or ID. Only records in the view are returned, in the view's order.
    request:
      method: GET
      url: https://api.airtable.com/v0/{baseId}/{tableId}
      query:
        maxRecords: "{maxRecords}"
        filterByFormula: "{filterFormula}"
        pageSize: "{pageSize}"
        offset: "{offset}"
        view: "{view}"
      headers:
        Authorization: Bearer {credential.access_token}
    response:
      outputs:
        records:
          path: $.records[*]
          type: array
          description: Records, each with an id, a created time and its fields.
        offset:
          path: $.offset
          type: string
          description: Offset for the next page, if there is one.
  - id: get_record
    name: Get a record
    description: Read one record from an Airtable table by its ID.
    effect: read
    params:
      baseId:
        type: string
        required: true
        description: Airtable base ID (starts with "app").
      tableId:
        type: string
        required: true
        description: Table ID (starts with "tbl") or the table name.
      recordId:
        type: string
        required: true
        description: Record ID (starts with "rec").
    request:
      method: GET
      url: https://api.airtable.com/v0/{baseId}/{tableId}/{recordId}
      headers:
        Authorization: Bearer {credential.access_token}
    response:
      outputs:
        id:
          path: $.id
          type: string
          description: Record ID.
        fields:
          path: $.fields
          type: object
          description: The record's field values.
