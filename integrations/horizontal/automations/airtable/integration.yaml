# Airtable: Not checked: the vendor's reference could not be read here. Written from the published API reference; not called against the live service.
schema_version: 1
id: airtable
name: Airtable
version: 1.0.0
description: Read and edit Airtable bases and records with your own Airtable account.
kind: plugin
group: horizontal
category: automations
auth:
  mode: oauth
  provider: airtable
  scopes:
  - data.records:read
  - data.records:write
  - schema.bases:read
hosts:
- api.airtable.com
data_classes:
- internal
- confidential
policy_default: needs_approval
actions:
- id: list_bases
  name: List bases
  description: List the bases you can open.
  effect: read
  params:
    offset:
      type: string
      description: Offset from a previous response, for the next page.
  request:
    method: GET
    url: https://api.airtable.com/v0/meta/bases
    headers: &id001
      Authorization: Bearer {credential.access_token}
    query:
      offset: '{offset}'
  response:
    outputs:
      bases:
        path: $.bases[*]
        type: array
        description: Bases, each with an id, a name and your permission level.
      offset:
        path: $.offset
        type: string
        description: Offset for the next page.
- id: list_tables
  name: List tables
  description: List the tables and fields of a base.
  effect: read
  params:
    baseId:
      type: string
      description: Base ID (starts with app).
      required: true
  request:
    method: GET
    url: https://api.airtable.com/v0/meta/bases/{baseId}/tables
    headers: *id001
  response:
    outputs:
      tables:
        path: $.tables[*]
        type: array
        description: Tables, each with an id, a name and its fields.
- id: list_records
  name: List records
  description: Read records from a table.
  effect: read
  params:
    baseId:
      type: string
      description: Base ID (starts with app).
      required: true
    tableId:
      type: string
      description: Table ID (starts with tbl) or the table's name.
      required: true
    maxRecords:
      type: integer
      description: Most records to return in all.
      minimum: 1
      maximum: 1000
    filterFormula:
      type: string
      description: An Airtable formula that keeps matching records, for example ({Status} = 'Open').
    pageSize:
      type: integer
      description: Records per page (1 to 100).
      minimum: 1
      maximum: 100
    offset:
      type: string
      description: Offset from a previous response.
    view:
      type: string
      description: Name or ID of a view; only its records are returned, in its order.
  request:
    method: GET
    url: https://api.airtable.com/v0/{baseId}/{tableId}
    headers: *id001
    query:
      maxRecords: '{maxRecords}'
      filterByFormula: '{filterFormula}'
      pageSize: '{pageSize}'
      offset: '{offset}'
      view: '{view}'
  response:
    outputs:
      records:
        path: $.records[*]
        type: array
        description: Records, each with an id, a createdTime and its fields.
      offset:
        path: $.offset
        type: string
        description: Offset for the next page.
- id: get_record
  name: Get record
  description: Read one record.
  effect: read
  params:
    baseId:
      type: string
      description: Base ID.
      required: true
    tableId:
      type: string
      description: Table ID or name.
      required: true
    recordId:
      type: string
      description: Record ID (starts with rec).
      required: true
  request:
    method: GET
    url: https://api.airtable.com/v0/{baseId}/{tableId}/{recordId}
    headers: *id001
  response:
    outputs:
      id:
        path: $.id
        type: string
        description: Record ID.
      createdTime:
        path: $.createdTime
        type: string
        description: When it was created.
      fields:
        path: $.fields
        type: object
        description: The record's field values.
- id: create_record
  name: Create record
  description: Add a record to a table.
  effect: write
  params:
    baseId:
      type: string
      description: Base ID.
      required: true
    tableId:
      type: string
      description: Table ID or name.
      required: true
    fields:
      type: object
      description: Field values by field name.
      required: true
  request:
    method: POST
    url: https://api.airtable.com/v0/{baseId}/{tableId}
    headers: &id002
      Authorization: Bearer {credential.access_token}
      Content-Type: application/json
    body:
      fields: '{fields}'
  response:
    outputs:
      id:
        path: $.id
        type: string
        description: New record ID.
      fields:
        path: $.fields
        type: object
        description: Saved field values.
- id: update_record
  name: Update record
  description: Change fields of a record; other fields stay as they are.
  effect: write
  params:
    baseId:
      type: string
      description: Base ID.
      required: true
    tableId:
      type: string
      description: Table ID or name.
      required: true
    recordId:
      type: string
      description: Record ID.
      required: true
    fields:
      type: object
      description: Field values to change, by field name.
      required: true
  request:
    method: PATCH
    url: https://api.airtable.com/v0/{baseId}/{tableId}/{recordId}
    headers: *id002
    body:
      fields: '{fields}'
  response:
    outputs:
      id:
        path: $.id
        type: string
        description: Record ID.
      fields:
        path: $.fields
        type: object
        description: Field values after the change.
- id: delete_record
  name: Delete record
  description: Delete a record.
  effect: write
  params:
    baseId:
      type: string
      description: Base ID.
      required: true
    tableId:
      type: string
      description: Table ID or name.
      required: true
    recordId:
      type: string
      description: Record ID.
      required: true
  request:
    method: DELETE
    url: https://api.airtable.com/v0/{baseId}/{tableId}/{recordId}
    headers: *id001
  response:
    outputs:
      id:
        path: $.id
        type: string
        description: ID of the deleted record.
      deleted:
        path: $.deleted
        type: boolean
        description: True once it is deleted.
skills:
- name: airtable-table-summary
  description: Summarise what is in an Airtable table.
  content: 'When asked what is in a table, read its fields, then a page of records, and report: what the table tracks, how
    many records were read, common values in the main fields, and anything that looks incomplete. Do not edit records unless
    asked.'
