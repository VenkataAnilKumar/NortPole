# Derived from open-source (Apache-2.0) tool definitions: see ../../../NOTICE. Reviewed before use; not yet checked against the vendor's own documentation.
schema_version: 1
id: hubspot
name: HubSpot
version: 1.0.0
description: Interact with HubSpot CRM or trigger workflows from HubSpot events
kind: plugin
group: horizontal
category: sales
auth:
  mode: oauth
  provider: hubspot
  scopes: []
hosts:
- api.hubapi.com
data_classes:
- internal
policy_default: needs_approval
actions:
- id: create_list
  name: Create List
  description: Create a new list in HubSpot. Specify the object type and processing type (MANUAL or DYNAMIC)
  effect: write
  params:
    name:
      type: string
      description: Name of the list
      required: true
    objectTypeId:
      type: string
      description: Object type ID (e.g., "0-1" for contacts, "0-2" for companies)
      required: true
    processingType:
      type: string
      description: 'Processing type: "MANUAL" for static lists or "DYNAMIC" for active lists'
      required: true
  request:
    method: POST
    url: https://api.hubapi.com/crm/v3/lists
    headers:
      Authorization: Bearer {credential.access_token}
      Content-Type: application/json
    body:
      name: '{name}'
      objectTypeId: '{objectTypeId}'
      processingType: '{processingType}'
  response:
    outputs:
      list:
        path: $.list
        type: object
        description: HubSpot list
      listId:
        path: $.list.listId
        type: string
        description: The created list ID
- id: get_appointment
  name: Get Appointment
  description: Retrieve a single appointment by ID from HubSpot
  effect: read
  params:
    appointmentId:
      type: string
      description: The HubSpot appointment ID to retrieve
      required: true
    idProperty:
      type: string
      description: Property to use as unique identifier. If not specified, uses record ID
    properties:
      type: string
      description: Comma-separated list of HubSpot property names to return (e.g., "hs_appointment_name,hs_appointment_start")
    associations:
      type: string
      description: Comma-separated list of object types to retrieve associated IDs for (e.g., "contacts,companies")
  request:
    method: GET
    url: https://api.hubapi.com/crm/v3/objects/appointments/{appointmentId}
    query:
      idProperty: '{idProperty}'
      properties: '{properties}'
      associations: '{associations}'
    headers:
      Authorization: Bearer {credential.access_token}
      Content-Type: application/json
  response:
    outputs:
      appointment:
        path: $
        type: object
        description: HubSpot appointment record
      appointmentId:
        path: $.id
        type: string
        description: The retrieved appointment ID
- id: get_cart
