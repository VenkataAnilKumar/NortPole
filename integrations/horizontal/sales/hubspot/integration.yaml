- id: list_associations
  name: List Associations
  description: List records of one object type associated with a given record, e.g. all emails or notes logged on a contact
  effect: read
  params:
    objectType:
      type: string
      description: Source object type (e.g., "contacts", "companies", "deals")
      required: true
    objectId:
      type: string
      description: ID of the source record
      required: true
    toObjectType:
      type: string
      description: Target object type to list associations to (e.g., "emails", "notes", "deals")
      required: true
    limit:
      type: string
      description: Maximum number of associated records per page (default 500)
    after:
      type: string
      description: Pagination cursor for next page (from previous response)
  request:
    method: GET
    url: https://api.hubapi.com/crm/v4/objects/{objectType}/{objectId}/associations/{toObjectType}
    query:
      limit: '{limit}'
      after: '{after}'
    headers:
      Authorization: Bearer {credential.access_token}
      Content-Type: application/json
  response:
    outputs:
      results:
        path: $.results
        type: array
        description: Array of associated records
      paging:
        path: $.paging
        type: object
        description: Pagination information for fetching more results
