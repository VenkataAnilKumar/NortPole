# Stripe: written for NortPole from the vendor's published API reference; not yet checked against the live service.
schema_version: 1
id: stripe
name: Stripe
version: 1.0.0
description: Read your Stripe customers, payments and invoices, and create customers and products, with your own Stripe key.
kind: plugin
group: horizontal
category: sales
auth:
  mode: api_key
  provider: stripe
hosts:
- api.stripe.com
data_classes:
- internal
- confidential
policy_default: needs_approval
actions:
- id: list_customers
  name: List customers
  description: List customers, newest first.
  effect: read
  params:
    limit:
      type: integer
      description: How many (1 to 100).
      minimum: 1
      maximum: 100
      default: 10
    startingAfter:
      type: string
      description: ID to continue after, from the last item of the previous page.
  request:
    method: GET
    url: https://api.stripe.com/v1/customers
    headers: &id001
      Authorization: Bearer {credential.api_key}
    query:
      limit: '{limit}'
      starting_after: '{startingAfter}'
  response:
    outputs:
      customers:
        path: $.data[*]
        type: array
        description: Customers.
      has_more:
        path: $.has_more
        type: boolean
        description: True when more exist.
- id: get_customer
  name: Get customer
  description: Get one customer by ID.
  effect: read
  params:
    customerId:
      type: string
      description: The customer's ID.
      required: true
  request:
    method: GET
    url: https://api.stripe.com/v1/customers/{customerId}
    headers: *id001
  response:
    outputs:
      id:
        path: $.id
        type: string
        description: ID.
      object:
        path: $.object
        type: string
        description: Kind of object.
- id: search_customers
  name: Search customers
  description: Search customers with Stripe's query language, for example email:'a@b.com'.
  effect: read
  params:
    query:
      type: string
      description: Stripe search query.
      required: true
    limit:
      type: integer
      description: How many (1 to 100).
      minimum: 1
      maximum: 100
      default: 10
  request:
    method: GET
    url: https://api.stripe.com/v1/customers/search
    headers: *id001
    query:
      query: '{query}'
      limit: '{limit}'
  response:
    outputs:
      customers:
        path: $.data[*]
        type: array
        description: Matching customers.
      has_more:
        path: $.has_more
        type: boolean
        description: True when more match.
- id: list_charges
  name: List charges
  description: List charges, newest first.
  effect: read
  params:
    limit:
      type: integer
      description: How many (1 to 100).
      minimum: 1
      maximum: 100
      default: 10
    startingAfter:
      type: string
      description: ID to continue after, from the last item of the previous page.
  request:
    method: GET
    url: https://api.stripe.com/v1/charges
    headers: *id001
    query:
