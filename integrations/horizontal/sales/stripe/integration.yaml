- id: list_subscriptions
  name: List subscriptions
  description: List subscriptions, newest first.
  effect: read
  params:
    limit:
      type: integer
      description: How many (1 to 100).
      minimum: 1
      maximum: 100
      default: 10
    startingAfter:
      type: string
      description: ID to continue after, from the last item of the previous page.
  request:
    method: GET
    url: https://api.stripe.com/v1/subscriptions
    headers: *id001
    query:
      limit: '{limit}'
      starting_after: '{startingAfter}'
  response:
    outputs:
      subscriptions:
        path: $.data[*]
        type: array
        description: Subscriptions.
      has_more:
        path: $.has_more
        type: boolean
        description: True when more exist.
- id: get_balance
  name: Get balance
  description: Get your account balance.
  effect: read
  request:
    method: GET
    url: https://api.stripe.com/v1/balance
    headers: *id001
  response:
    outputs:
      available:
        path: $.available[*]
        type: array
        description: Available amounts by currency.
      pending:
        path: $.pending[*]
        type: array
        description: Pending amounts by currency.
- id: create_customer
  name: Create customer
  description: Create a customer.
  effect: write
  params:
    email:
      type: string
      description: The customer's email.
    name:
      type: string
      description: The customer's name.
    description:
      type: string
      description: A note to keep with the customer.
  request:
    method: POST
    url: https://api.stripe.com/v1/customers
    headers: &id002
      Authorization: Bearer {credential.api_key}
      Content-Type: application/x-www-form-urlencoded
    body:
      email: '{email}'
      name: '{name}'
      description: '{description}'
  response:
    outputs:
      id:
        path: $.id
        type: string
        description: New customer ID.
      email:
        path: $.email
        type: string
        description: The customer's email.
- id: create_product
  name: Create product
  description: Create a product.
  effect: write
  params:
    name:
      type: string
      description: The product's name.
      required: true
    description:
      type: string
      description: What the product is.
  request:
    method: POST
    url: https://api.stripe.com/v1/products
    headers: *id002
    body:
      name: '{name}'
      description: '{description}'
  response:
    outputs:
      id:
        path: $.id
        type: string
        description: New product ID.
      active:
        path: $.active
        type: boolean
        description: True when active.
- id: delete_invoice
  name: Delete draft invoice
  description: Delete an invoice that is still a draft.
  effect: write
  params:
    invoiceId:
      type: string
      description: Invoice ID.
      required: true
  request:
    method: DELETE
    url: https://api.stripe.com/v1/invoices/{invoiceId}
    headers: *id001
  response:
    outputs:
      id:
        path: $.id
        type: string
        description: ID of the deleted invoice.
      deleted:
        path: $.deleted
        type: boolean
        description: True once deleted.
skills:
- name: stripe-customer-lookup
  description: Find a customer and summarise their payments and invoices.
  content: 'When asked about a Stripe customer:

    1. Search customers by email or name.

    2. List their recent charges and invoices.

    3. Summarise: customer, how much was paid, anything unpaid or failed, and the latest activity date.

    Amounts are in the smallest currency unit; convert before showing them. Never create, change or delete anything unless
    the person asks and approves.'
