        type: array
        description: Products.
      has_more:
        path: $.has_more
        type: boolean
        description: True when more exist.
- id: get_product
  name: Get product
  description: Get one product by ID.
  effect: read
  params:
    productId:
      type: string
      description: The product's ID.
