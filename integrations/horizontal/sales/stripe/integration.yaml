      starting_after: '{startingAfter}'
  response:
    outputs:
      charges:
        path: $.data[*]
        type: array
        description: Charges.
      has_more:
        path: $.has_more
        type: boolean
        description: True when more exist.
- id: get_charge
  name: Get charge
  description: Get one charge by ID.
  effect: read
  params:
    chargeId:
      type: string
      description: The charge's ID.
      required: true
  request:
    method: GET
    url: https://api.stripe.com/v1/charges/{chargeId}
    headers: *id001
  response:
    outputs:
      id:
        path: $.id
        type: string
        description: ID.
      object:
        path: $.object
        type: string
        description: Kind of object.
