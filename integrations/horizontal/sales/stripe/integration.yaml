# Stripe: reads, deletes and two creates. Derived from open-source (Apache-2.0) tool definitions: see ../../../NOTICE. Reviewed before use; not yet checked against the vendor's own documentation.
schema_version: 1
id: stripe
name: Stripe
version: 1.0.0
description: Process payments and manage Stripe data
kind: plugin
group: horizontal
category: sales
auth:
  mode: api_key
  provider: stripe
hosts:
- api.stripe.com
data_classes:
- internal
policy_default: needs_approval
actions:
- id: delete_invoice
  name: Delete Invoice
  description: Permanently delete a draft invoice
  effect: write
  params:
    id:
      type: string
      description: Invoice ID (e.g., in_1234567890)
      required: true
  request:
    method: DELETE
    url: https://api.stripe.com/v1/invoices/{id}
    headers:
      Authorization: Bearer {credential.api_key}
      Content-Type: application/x-www-form-urlencoded
  response:
    outputs:
      deleted:
        path: $.deleted
        type: boolean
        description: Whether the invoice was deleted
      id:
        path: $.id
        type: string
        description: The ID of the deleted invoice
- id: delete_product
  name: Delete Product
  description: Permanently delete a product
  effect: write
  params:
    id:
      type: string
      description: Product ID (e.g., prod_1234567890)
      required: true
  request:
    method: DELETE
    url: https://api.stripe.com/v1/products/{id}
    headers:
      Authorization: Bearer {credential.api_key}
      Content-Type: application/x-www-form-urlencoded
  response:
    outputs:
      deleted:
        path: $.deleted
        type: boolean
        description: Whether the product was deleted
      id:
        path: $.id
        type: string
        description: The ID of the deleted product
- id: retrieve_charge
  name: Retrieve Charge
  description: Retrieve an existing charge by ID
  effect: read
  params:
    id:
      type: string
      description: Charge ID (e.g., ch_1234567890)
      required: true
  request:
    method: GET
    url: https://api.stripe.com/v1/charges/{id}
    headers:
      Authorization: Bearer {credential.api_key}
      Content-Type: application/x-www-form-urlencoded
  response:
    outputs:
      charge:
        path: $
        type: object
        description: The retrieved Charge object
- id: retrieve_event
  name: Retrieve Event
  description: Retrieve an existing Event by ID
  effect: read
  params:
    id:
      type: string
      description: Event ID (e.g., evt_1234567890)
      required: true
  request:
    method: GET
    url: https://api.stripe.com/v1/events/{id}
    headers:
      Authorization: Bearer {credential.api_key}
      Content-Type: application/x-www-form-urlencoded
  response:
    outputs:
      event:
        path: $
        type: object
        description: The retrieved Event object
- id: retrieve_price
  name: Retrieve Price
  description: Retrieve an existing price by ID
  effect: read
  params:
    id:
      type: string
      description: Price ID (e.g., price_1234567890)
      required: true
  request:
    method: GET
    url: https://api.stripe.com/v1/prices/{id}
    headers:
      Authorization: Bearer {credential.api_key}
      Content-Type: application/x-www-form-urlencoded
  response:
    outputs:
      price:
        path: $
        type: object
        description: The retrieved price object
- id: retrieve_product
  name: Retrieve Product
  description: Retrieve an existing product by ID
  effect: read
  params:
    id:
      type: string
      description: Product ID (e.g., prod_1234567890)
      required: true
  request:
    method: GET
    url: https://api.stripe.com/v1/products/{id}
    headers:
      Authorization: Bearer {credential.api_key}
      Content-Type: application/x-www-form-urlencoded
  response:
    outputs:
      product:
        path: $
        type: object
        description: The retrieved product object
- id: search_charges
  name: Search Charges
  description: Search for charges using query syntax
  effect: read
  params:
    query:
      type: string
      description: Search query (e.g., "status:'succeeded' AND currency:'usd'")
      required: true
    limit:
      type: integer
      description: Number of results to return (default 10, max 100)
    page:
      type: string
      description: Pagination token from metadata.next_page of the previous search; omit for the first page
  request:
    method: GET
    url: https://api.stripe.com/v1/charges/search
    query:
      query: '{query}'
      limit: '{limit}'
      page: '{page}'
    headers:
      Authorization: Bearer {credential.api_key}
      Content-Type: application/x-www-form-urlencoded
  response:
    outputs:
      charges:
        path: $.data
        type: object
        description: Array of matching Charge objects
- id: search_customers
  name: Search Customers
  description: Search for customers using query syntax
  effect: read
  params:
    query:
      type: string
      description: Search query (e.g., "email:'customer@example.com'")
      required: true
    limit:
      type: integer
      description: Number of results to return (default 10, max 100)
    page:
      type: string
      description: Pagination token from metadata.next_page of the previous search; omit for the first page
  request:
    method: GET
    url: https://api.stripe.com/v1/customers/search
    query:
      query: '{query}'
      limit: '{limit}'
      page: '{page}'
    headers:
      Authorization: Bearer {credential.api_key}
      Content-Type: application/x-www-form-urlencoded
  response:
    outputs:
      customers:
        path: $.data
        type: array
        description: Array of matching customer objects
- id: search_invoices
  name: Search Invoices
  description: Search for invoices using query syntax
  effect: read
  params:
    query:
      type: string
      description: Search query (e.g., "customer:'cus_1234567890'")
      required: true
    limit:
      type: integer
      description: Number of results to return (default 10, max 100)
    page:
      type: string
      description: Pagination token from metadata.next_page of the previous search; omit for the first page
  request:
    method: GET
    url: https://api.stripe.com/v1/invoices/search
    query:
      query: '{query}'
      limit: '{limit}'
      page: '{page}'
    headers:
      Authorization: Bearer {credential.api_key}
      Content-Type: application/x-www-form-urlencoded
  response:
    outputs:
      invoices:
        path: $.data
        type: object
        description: Array of matching invoice objects
- id: search_payment_intents
  name: Search Payment Intents
  description: Search for Payment Intents using query syntax
  effect: read
  params:
    query:
      type: string
      description: Search query (e.g., "status:'succeeded' AND currency:'usd'")
      required: true
    limit:
      type: integer
      description: Number of results to return (default 10, max 100)
    page:
      type: string
      description: Pagination token from metadata.next_page of the previous search; omit for the first page
  request:
    method: GET
    url: https://api.stripe.com/v1/payment_intents/search
    query:
      query: '{query}'
      limit: '{limit}'
      page: '{page}'
    headers:
      Authorization: Bearer {credential.api_key}
      Content-Type: application/x-www-form-urlencoded
  response:
    outputs:
      payment_intents:
        path: $.data
        type: array
        description: Array of matching Payment Intent objects
- id: search_prices
  name: Search Prices
  description: Search for prices using query syntax
  effect: read
  params:
    query:
      type: string
      description: Search query (e.g., "active:'true' AND currency:'usd'")
      required: true
    limit:
      type: integer
      description: Number of results to return (default 10, max 100)
    page:
      type: string
      description: Pagination token from metadata.next_page of the previous search; omit for the first page
  request:
    method: GET
    url: https://api.stripe.com/v1/prices/search
    query:
      query: '{query}'
      limit: '{limit}'
      page: '{page}'
    headers:
      Authorization: Bearer {credential.api_key}
      Content-Type: application/x-www-form-urlencoded
  response:
    outputs:
      prices:
        path: $.data
        type: object
        description: Array of matching price objects
- id: search_products
  name: Search Products
  description: Search for products using query syntax
  effect: read
  params:
    query:
      type: string
      description: Search query (e.g., "name:'shirt'")
      required: true
    limit:
      type: integer
      description: Number of results to return (default 10, max 100)
    page:
      type: string
      description: Pagination token from metadata.next_page of the previous search; omit for the first page
  request:
    method: GET
    url: https://api.stripe.com/v1/products/search
    query:
      query: '{query}'
      limit: '{limit}'
      page: '{page}'
    headers:
      Authorization: Bearer {credential.api_key}
      Content-Type: application/x-www-form-urlencoded
  response:
    outputs:
      products:
        path: $.data
        type: object
        description: Array of matching product objects
- id: search_subscriptions
  name: Search Subscriptions
  description: Search one page of subscriptions using query syntax. Pass metadata.next_page as page to continue.
  effect: read
  params:
    query:
      type: string
      description: Search query (e.g., "status:'active' AND metadata['order_id']:'6735'")
      required: true
    page:
      type: string
      description: Pagination token from metadata.next_page. Omit for the first page and keep the same query.
    limit:
      type: integer
      description: Number of results to return (default 10, max 100)
  request:
    method: GET
    url: https://api.stripe.com/v1/subscriptions/search
    query:
      query: '{query}'
      limit: '{limit}'
      page: '{page}'
    headers:
      Authorization: Bearer {credential.api_key}
      Content-Type: application/x-www-form-urlencoded
  response:
    outputs:
      subscriptions:
        path: $.data
        type: array
        description: Array of matching subscription objects
- id: create_customer
  name: Create Customer
  description: Create a customer in Stripe. Written from Stripe's published customers API.
  effect: write
  params:
    email:
      type: string
      description: The customer's email address.
    name:
      type: string
      description: The customer's full name or business name.
    description:
      type: string
      description: A note to keep with the customer.
  request:
    method: POST
    url: https://api.stripe.com/v1/customers
    headers:
      Authorization: Bearer {credential.api_key}
      Content-Type: application/x-www-form-urlencoded
    body:
      email: '{email}'
      name: '{name}'
      description: '{description}'
  response:
    outputs:
      id:
        path: $.id
        type: string
        description: The new customer's ID.
      email:
        path: $.email
        type: string
        description: The customer's email.
- id: create_product
  name: Create Product
  description: Create a product in Stripe. Written from Stripe's published products API.
  effect: write
  params:
    name:
      type: string
      description: The product's name.
      required: true
    description:
      type: string
      description: What the product is.
  request:
    method: POST
    url: https://api.stripe.com/v1/products
    headers:
      Authorization: Bearer {credential.api_key}
      Content-Type: application/x-www-form-urlencoded
    body:
      name: '{name}'
      description: '{description}'
  response:
    outputs:
      id:
        path: $.id
        type: string
        description: The new product's ID.
      active:
        path: $.active
        type: boolean
        description: Whether the product is active.
