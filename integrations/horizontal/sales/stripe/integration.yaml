  name: List prices
  description: List prices, newest first.
  effect: read
  params:
    limit:
      type: integer
      description: How many (1 to 100).
      minimum: 1
      maximum: 100
      default: 10
    startingAfter:
      type: string
      description: ID to continue after, from the last item of the previous page.
  request:
    method: GET
    url: https://api.stripe.com/v1/prices
    headers: *id001
    query:
      limit: '{limit}'
      starting_after: '{startingAfter}'
  response:
    outputs:
      prices:
        path: $.data[*]
