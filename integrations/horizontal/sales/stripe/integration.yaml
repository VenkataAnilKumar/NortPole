  response:
    outputs:
      invoices:
        path: $.data[*]
        type: array
        description: Invoices.
      has_more:
        path: $.has_more
        type: boolean
        description: True when more exist.
- id: get_invoice
  name: Get invoice
  description: Get one invoice by ID.
  effect: read
  params:
    invoiceId:
      type: string
      description: The invoice's ID.
      required: true
  request:
    method: GET
    url: https://api.stripe.com/v1/invoices/{invoiceId}
    headers: *id001
  response:
    outputs:
      id:
        path: $.id
        type: string
        description: ID.
      object:
        path: $.object
        type: string
        description: Kind of object.
