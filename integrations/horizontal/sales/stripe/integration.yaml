  request:
    method: GET
    url: https://api.stripe.com/v1/products/{productId}
    headers: *id001
  response:
    outputs:
      id:
        path: $.id
        type: string
        description: ID.
      object:
        path: $.object
        type: string
        description: Kind of object.
