# NortPole single-host profile, lite mode: web + API + PostgreSQL + Redis.
# No search index and no model server (see README.md next to this file).
# Required environment (no defaults, so a missing secret stops the start):
#   POSTGRES_PASSWORD, USER_AUTH_SECRET (random hex, e.g. `openssl rand -hex 32`),
#   ENCRYPTION_KEY_SECRET (seals stored secrets: `python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())'`;
#   keep it with your backups, a database restored without it cannot open its secrets)
name: nortpole
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_USER: nortpole
      POSTGRES_DB: nortpole
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nortpole -d nortpole"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    image: nortpole-core:${NORTPOLE_VERSION:-dev}
    build:
      context: ../../../services/core
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: nortpole
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: nortpole
      REDIS_HOST: redis
      USER_AUTH_SECRET: ${USER_AUTH_SECRET:?set USER_AUTH_SECRET}
      ENCRYPTION_KEY_SECRET: ${ENCRYPTION_KEY_SECRET:?set ENCRYPTION_KEY_SECRET}
      AUTH_TYPE: basic
      DISABLE_VECTOR_DB: "true"
      CACHE_BACKEND: postgres
      FILE_STORE_BACKEND: postgres
      NORTPOLE_OFFLINE_TOKENIZER: "true"
      HF_HUB_OFFLINE: "1"
      NORTPOLE_VERSION: ${NORTPOLE_VERSION:-dev}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets a model server on this machine be used as http://host.docker.internal:<port>
    expose:
      - "8080"   # reached through the proxy; not published
    restart: unless-stopped

  web:
    image: nortpole-web:${NORTPOLE_VERSION:-dev}
    build:
      context: ../../../apps/workspace
      args:
        INTERNAL_URL: http://api:8080   # fixed at build time
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    depends_on: [web, api]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:3000:80"   # the only published web port; add TLS here
    restart: unless-stopped

volumes:
  dbdata:
