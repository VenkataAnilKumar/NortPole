# Single entry point: /api/ goes to the API (prefix removed), everything else to the web app.
# Add TLS here before exposing this to anyone: this file serves plain HTTP.
# Docker's own resolver, re-asked every 10 s, so a recreated api or web container is found again.
resolver 127.0.0.11 valid=10s;

server {
  listen 80;
  client_max_body_size 100m;

  location /api/ {
    set $api http://api:8080;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  location / {
    set $web http://web:3000;
    proxy_pass $web;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
