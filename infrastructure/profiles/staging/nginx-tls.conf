# TLS entry point: HTTP redirects to HTTPS; HTTPS goes to the API (/api/, prefix removed) or the web app.
# The certificate and key are mounted by docker-compose.tls.yml; they are never part of the repository.
# Docker's own resolver, re-asked every 10 s, so a recreated api or web container is found again.
resolver 127.0.0.11 valid=10s;

server {
  listen 80;
  # Health probes stay on plain HTTP so a load balancer can check without a certificate.
  location = /api/health {
    set $api http://api:8080;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api;
  }
  location / {
    # Assumes HTTPS is on the standard port 443 (the redirect drops the port).
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  client_max_body_size 100m;

  ssl_certificate     /etc/nginx/tls/tls.crt;
  ssl_certificate_key /etc/nginx/tls/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location /api/ {
    set $api http://api:8080;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 300s;
    # The web app sends its own copies of these headers; keep exactly one set (the ones above).
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
  }

  location / {
    set $web http://web:3000;
    proxy_pass $web;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    # The web app sends its own copies of these headers; keep exactly one set (the ones above).
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
  }
}
