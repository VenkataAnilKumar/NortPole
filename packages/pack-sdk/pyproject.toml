[project]
name = "evolvxsi-pack-sdk"
version = "0.1.0"
description = "Validate, build and sign EvolvXSI workflow packs."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "jsonschema>=4.20", "cryptography>=42"]

[project.scripts]
evolvxsi-pack = "evolvxsi_pack_sdk.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["evolvxsi_pack_sdk"]
