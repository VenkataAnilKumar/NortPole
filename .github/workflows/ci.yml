# Checks that run on every pull request and on pushes to main, plus a nightly run of the whole backend unit suite.
# Every job was run locally with the same commands first. Actions are pinned by version tag, not by commit SHA; pin them
# by SHA when your organisation requires it.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"   # nightly full backend suite
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Nightly and manual runs get their own group, so a push to main does not cancel the long full-suite run.
  group: ci-${{ github.event_name == 'schedule' && 'nightly' || github.event_name == 'workflow_dispatch' && 'manual' || 'push-pr' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure-and-tools:
    name: Structure check and tool tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Repository structure, document index and local links
        run: python tools/validate_structure.py
      - name: Tool tests (licence screen, structure check, bill of materials)
        run: |
          python -m pip install --quiet pytest
          python -m pytest tools/tests -q

  sbom:
    name: Software bill of materials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Write the bill of materials from the lock files
        run: python tools/sbom/generate_sbom.py --out sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error

  core-unit-tests:
    name: Core unit tests (NortPole-owned)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.5"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the locked backend dependencies
        run: |
          uv sync --frozen --no-dev --no-install-project --group backend
          uv pip install pytest
      - name: Unit tests for NortPole's own modules
        env:
          PYTHONPATH: .
          DISABLE_VECTOR_DB: "true"
          CACHE_BACKEND: postgres
          AUTH_TYPE: basic
          FILE_STORE_BACKEND: postgres
          EVOLVXSI_OFFLINE_TOKENIZER: "true"
          HF_HUB_OFFLINE: "1"
        run: >
          uv run --no-sync python -m pytest -q
          tests/unit/evolvxsi/action_binding tests/unit/evolvxsi/actions tests/unit/evolvxsi/audit_log
          tests/unit/evolvxsi/extensions tests/unit/evolvxsi/external_permissions tests/unit/evolvxsi/knowledge_access
          tests/unit/evolvxsi/packs tests/unit/evolvxsi/redaction tests/unit/evolvxsi/route_policy
          tests/unit/evolvxsi/tasks tests/unit/evolvxsi/tool_catalog tests/unit/evolvxsi/user_preferences
          tests/unit/evolvxsi/test_schedule_cadence.py tests/unit/evolvxsi/skills/test_bundled_skill_scripts.py
          tests/unit/evolvxsi/test_domain_boundaries.py tests/unit/evolvxsi/test_contracts_current.py

  pack-sdk:
    name: Pack SDK and first-party packs
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the SDK on its own (no server)
        run: python -m pip install --quiet ./packages/pack-sdk pytest
      - name: SDK tests
        run: python -m pytest -q packages/pack-sdk/tests
      - name: Validate every pack in the repository
        run: make packs

  core-unit-tests-full:
    name: Core unit tests (whole suite, nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: services/core
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.5"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the locked backend and test dependencies
        run: |
          uv sync --frozen --no-install-project --group backend --group dev --group azure-voice
          uv pip install pexpect
      - name: Every backend unit test
        # Only PYTHONPATH: some inherited tests check the defaults that the lite-mode settings would override.
        env:
          PYTHONPATH: .
        # The model-server tests need the separate model-server dependencies (torch); they are not part of this suite.
        run: uv run --no-sync python -m pytest -q -n auto tests/unit --ignore=tests/unit/model_server

  web-typecheck:
    name: Web app type check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/workspace
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the locked web dependencies
        run: bun install --frozen-lockfile
      - name: Build the shared web libraries
        run: cd lib/shared && bun run build && cd ../opal && bun run build
      - name: Type-check the app code (test files are typed separately; see the pending-work checklist)
        run: npx next typegen && npx tsc --noEmit -p tsconfig.app.json
