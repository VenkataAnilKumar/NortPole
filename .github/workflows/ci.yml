# Checks that run on every pull request and on pushes to main.
# The first two jobs were run locally with the same commands. The third (core unit tests) has not run on GitHub yet, so it
# is allowed to fail until it has: remove `continue-on-error` after its first green run.
# Actions are pinned by version tag, not by commit SHA; pin them by SHA when your organisation requires it.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure-and-tools:
    name: Structure check and tool tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Repository structure, document index and local links
        run: python tools/validate_structure.py
      - name: Tool tests (licence screen, structure check, bill of materials)
        run: |
          python -m pip install --quiet pytest
          python -m pytest tools/tests -q

  sbom:
    name: Software bill of materials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Write the bill of materials from the lock files
        run: python tools/sbom/generate_sbom.py --out sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error

  core-unit-tests:
    name: Core unit tests (EvolvXSI-owned)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: services/core
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.5"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the locked backend dependencies
        run: |
          uv sync --frozen --no-dev --no-install-project --group backend
          uv pip install pytest
      - name: Unit tests for packs, actions, redaction, extensions, tasks and the audit log
        env:
          PYTHONPATH: .
          DISABLE_VECTOR_DB: "true"
          CACHE_BACKEND: postgres
          AUTH_TYPE: basic
          FILE_STORE_BACKEND: postgres
          EVOLVXSI_OFFLINE_TOKENIZER: "true"
          HF_HUB_OFFLINE: "1"
        run: >
          uv run --no-sync python -m pytest -q
          tests/unit/evolvxsi/packs tests/unit/evolvxsi/actions tests/unit/evolvxsi/redaction
          tests/unit/evolvxsi/extensions tests/unit/evolvxsi/tasks tests/unit/evolvxsi/audit_log
